schema_version: 1
tool_version: v2.4.1
tool_checksums_sha256: c7ea4d433f1977d769e0a27506484457cb9e5e7252ca17d66a3c3ea37ca26132

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: ".verification"

coverage:
  modules:
    - module: "."
      mode: evidence

mutation:
  root: ".verification/mutation"
  imports:
    - module: "."
      archive: ".verification/mutation/bootstrap/root.zip"
      ledger: ".verification/mutation/migration-ledger.json"

api:
  baselines:
    - module: "."
      mode: apidiff
      path: api/baseline.txt

runtimes:
  deno: 2.9.3

operations:
  - module: "."
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^TestImmutableProgramsAndCallerOwnedCachesAreRaceSafe$'
        race: true
        count: 1
        timeout: 2m
  - module: "."
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: safety
        timeout: 20m
      - type: go-test
        packages:
          - "."
        run: '^TestHostileExecutionPathsAreBounded$'
        timeout: 20m
      - type: go-test
        packages:
          - "."
        run: '^TestExecutionDoesNotLeakGoroutinesOrBuffers$'
        count: 10
        timeout: 20m
  - module: "."
    gate: fuzz
    steps:
      - type: go-test
        packages:
          - "."
        fuzz: '^FuzzTokenizeAndParse$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages:
          - "."
        fuzz: '^FuzzCompileAndMatch$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages:
          - "."
        fuzz: '^FuzzUTF16Matcher$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages:
          - "."
        fuzz: '^FuzzReplaceAndSplit$'
        budget: 2s
        timeout: 2m
  - module: "."
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: "."
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
  - module: "."
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: "."
    gate: benchmark
    steps:
      - type: go-test
        packages:
          - "."
        benchmark: "."
        budget: 100ms
        timeout: 20m
